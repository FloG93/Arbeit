# Publishes app/ (Raumrechner, at the site root) and den Poster-Generator in zwei
# Kanälen: /poster/ ist die freigegebene Fassung, ausgepackt aus dem in
# poster/release.json eingetragenen Commit, und /poster/beta/ der aktuelle Stand
# des Branches. Freigeben heißt damit: diesen Zeiger ändern — die Dateien liegen
# nur einmal im Repo.
#
# Alles ist reines HTML/CSS/JS ohne Build-Schritt; erzeugt wird lediglich je
# Kanal eine build.js mit Version, Commit und Datum.
#
# HTTPS matters here beyond the usual reasons: a service worker (and with it
# offline use and "add to home screen") only works on a secure origin.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/inspiring-ritchie-kaz8vn
    # Ohne paths-Filter: eine Freigabe ändert nur poster/release.json, und der
    # Lauf dauert keine halbe Minute — die Ersparnis wäre den Fallstrick nicht wert.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Volle Historie samt Tags: der Release-Kanal wird aus einem Tag gebaut.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # One-time manual step before the first run:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # The workflow's GITHUB_TOKEN is not allowed to switch Pages on itself
      # ("Resource not accessible by integration"), so enablement is not set.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          set -eu

          write_build() { # $1 Ordner, $2 Kanal, $3 Version, $4 Commit
            printf 'window.Poster = window.Poster || {};\nPoster.BUILD = { channel: "%s", version: "%s", commit: "%s", date: "%s" };\n' \
              "$2" "$3" "$4" "$(date -u +%F)" > "$1/build.js"
          }

          mkdir -p dist
          cp -r app/. dist/

          # Release: der Commit aus poster/release.json. Ein Tag wäre der übliche
          # Weg, lässt sich aus der Entwicklungsumgebung aber nicht pushen — ein
          # Zeiger im Repo leistet dasselbe und macht jede Freigabe als eigenen
          # Commit in der Historie sichtbar.
          RELEASE_COMMIT="$(jq -r '.commit // empty' poster/release.json)"
          RELEASE_VERSION="$(jq -r '.version // empty' poster/release.json)"
          mkdir -p dist/poster
          if [ -n "$RELEASE_COMMIT" ] && git cat-file -e "$RELEASE_COMMIT^{commit}" 2>/dev/null; then
            git archive "$RELEASE_COMMIT" poster | tar -x -C "$RUNNER_TEMP"
            cp -r "$RUNNER_TEMP/poster/." dist/poster/
            write_build dist/poster release "$RELEASE_VERSION" "$(git rev-parse --short "$RELEASE_COMMIT")"
            echo "Release-Kanal aus $RELEASE_COMMIT ($RELEASE_VERSION)"
          else
            cp -r poster/. dist/poster/
            write_build dist/poster release "$(jq -r .version poster/version.json) (ohne Freigabe)" "$(git rev-parse --short HEAD)"
            echo "Release-Zeiger fehlt oder ist unbekannt — nehme den aktuellen Stand"
          fi

          # Beta: immer der Stand dieses Commits.
          mkdir -p dist/poster/beta
          cp -r poster/. dist/poster/beta/
          write_build dist/poster/beta beta "$(jq -r .version poster/version.json)" "$(git rev-parse --short HEAD)"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
