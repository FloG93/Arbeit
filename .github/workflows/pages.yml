# Publishes app/ to GitHub Pages. The app is plain HTML/CSS/JS, so there is
# nothing to build — the folder is uploaded as-is.
#
# HTTPS matters here beyond the usual reasons: a service worker (and with it
# offline use and "add to home screen") only works on a secure origin.
name: Deploy Raumrechner to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/inspiring-ritchie-kaz8vn
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # One-time manual step before the first run:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # The workflow's GITHUB_TOKEN is not allowed to switch Pages on itself
      # ("Resource not accessible by integration"), so enablement is not set.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload app/
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
