# Publishes start/ (Übersicht, an der Seitenwurzel), den Prüfassistenten unter
# /pruefung/ und den PPT-Konverter unter /ppt/. Die Excel-Mappe
# Azubi-Leistungen liegt unter /azubi/ zum Herunterladen — als Datei, nicht
# als App; sie bleibt im Repo einmal in werkzeuge/azubi-noten/.
#
# Der Raumrechner (früher /raum/) und der Musik-Poster-Generator (früher /poster/,
# mit Release- und Beta-Kanal) sind nach FloG93/Privat-Projekte umgezogen. Die
# Kacheln der Übersicht verweisen dorthin.
#
# Alles ist reines HTML/CSS/JS ohne Build-Schritt: die Ordner werden nebeneinander
# in ein Artefakt kopiert.
#
# HTTPS matters here beyond the usual reasons: a service worker (and with it
# offline use and "add to home screen") only works on a secure origin.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Ohne paths-Filter: der Lauf dauert keine halbe Minute, und ein Filter, der
    # eine Änderung übersieht, wäre der teurere Fehler.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # One-time manual step before the first run:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      # The workflow's GITHUB_TOKEN is not allowed to switch Pages on itself
      # ("Resource not accessible by integration"), so enablement is not set.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          set -eu

          mkdir -p dist
          # Übersicht an der Wurzel. Ihr Worker landet auf /sw.js – dieselbe
          # Stelle, an der früher der des Raumrechners lag, und löst ihn auf
          # Geräten mit alter Registrierung genau deshalb ab.
          cp -r start/. dist/

          # Prüfassistent: ein Kanal, reiner Kopiervorgang. Version und
          # Datenstand stehen in pruefung/version.json und data/index.json.
          mkdir -p dist/pruefung
          cp -r pruefung/. dist/pruefung/

          # PPT-Konverter: ebenfalls reiner Kopiervorgang.
          mkdir -p dist/ppt
          cp -r ppt/. dist/ppt/

          # Azubi-Leistungen: nur die fertige Mappe, nicht den Generator. Eine
          # Zeile, damit eine fehlende Datei den Lauf sichtbar scheitern lässt,
          # statt eine Kachel zu veröffentlichen, die ins Leere führt.
          mkdir -p dist/azubi
          cp werkzeuge/azubi-noten/Azubi-Leistungen.xlsx dist/azubi/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
